name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Verify dependencies
        run: go mod verify
      - name: Static checks
        run: go vet ./...
      - name: Unit and integration tests with race detector
        run: go test -race -count=1 ./...
      - name: Build and test two service processes
        run: |
          go build -trimpath -o /tmp/backuply ./cmd/backuply
          bash scripts/e2e.sh /tmp/backuply
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: backuply-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application image
        run: docker compose build
      - name: Initialize device identity
        run: docker compose run --rm backuply init -config /etc/backuply/backuply.conf
      - name: Start daemon and check local status
        run: docker compose up --wait --wait-timeout 60
      - name: Container diagnostics
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --remove-orphans
