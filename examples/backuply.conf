# Linux system service. Replace paths, address and fingerprint before use.
# Full-line comments only; paths are absolute. Restart after configuration edits.
[service]
listen = 192.168.1.10:24800
state_dir = /var/lib/backuply
scan_interval = 5s

[peer "laptop"]
address = 192.168.1.20:24800
device_id = REPLACE_WITH_LAPTOP_DEVICE_ID

[folder "projects"]
path = /srv/backuply/projects
source = local
peers = laptop
